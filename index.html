<!DOCTYPE html>
<html lang="es">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏆 SpeedRuns</title>

    <!-- Press Start 2P -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, #18264a 0%, #0b1020 45%, #05070d 100%);
            color: white;
            font-family: "Press Start 2P", monospace;
            overflow-x: hidden;
        }

.account-button {
    padding: 13px 16px;

    background: #1756a5;
    border: 3px solid #4389dc;

    box-shadow: 4px 4px 0 #082c59;

    color: white;

    font-family: "Press Start 2P", monospace;
    font-size: 11px;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.account-button:hover {
    transform: translateY(-2px);
    background: #236fc8;
}
        
        /* =========================
           FONDO ANIMADO
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .pixel {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ffffff;
            opacity: 0.35;
            animation: floatPixel linear infinite;
        }

        .pixel:nth-child(1) {
            left: 8%;
            animation-duration: 8s;
            animation-delay: -2s;
        }

        .pixel:nth-child(2) {
            left: 18%;
            animation-duration: 11s;
            animation-delay: -6s;
        }

        .pixel:nth-child(3) {
            left: 31%;
            animation-duration: 9s;
            animation-delay: -4s;
        }

        .pixel:nth-child(4) {
            left: 44%;
            animation-duration: 13s;
            animation-delay: -8s;
        }

        .pixel:nth-child(5) {
            left: 57%;
            animation-duration: 10s;
            animation-delay: -3s;
        }

        .pixel:nth-child(6) {
            left: 69%;
            animation-duration: 12s;
            animation-delay: -7s;
        }

        .pixel:nth-child(7) {
            left: 82%;
            animation-duration: 9s;
            animation-delay: -5s;
        }

        .pixel:nth-child(8) {
            left: 94%;
            animation-duration: 14s;
            animation-delay: -10s;
        }

        @keyframes floatPixel {
            from {
                top: 110%;
                transform: translateX(0);
            }

            to {
                top: -10%;
                transform: translateX(80px);
            }
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: relative;
            z-index: 10;

            height: 82px;
            padding: 0 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 7, 13, 0.82);
            border-bottom: 3px solid #174b91;
            backdrop-filter: blur(8px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;

            color: #f7d046;
            font-size: 19px;
            text-decoration: none;

            transition: transform 0.2s ease;
        }

        .logo:hover {
            transform: scale(1.04);
        }

        .trophy {
            font-size: 31px;
            filter: drop-shadow(3px 3px 0 #000);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav button,
        .extras-button {
            border: 0;
            background: none;
            color: white;

            font-family: "Press Start 2P", monospace;
            font-size: 11px;

            cursor: pointer;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        nav button:hover {
            color: #f7d046;
            transform: translateY(-2px);
        }

        .extras-button {
            padding: 13px 16px;

            background: #d92828;
            border: 3px solid #ff5555;

            box-shadow: 4px 4px 0 #720d0d;
        }

        .extras-button:hover {
            transform: translateY(-2px);
            background: #ee3838;
        }

        /* =========================
           CONTENIDO PRINCIPAL
        ========================= */

        main {
            position: relative;
            z-index: 2;

            min-height: calc(100vh - 82px);

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 90px 20px;
        }

        .hero {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;

            color: #f7d046;

            font-size: clamp(30px, 6vw, 62px);
            line-height: 1.4;

            text-shadow:
                5px 5px 0 #000;
        }

        .hero h2 {
            margin: 30px 0 55px;

            font-size: clamp(14px, 2vw, 20px);
            line-height: 2;

            color: #ffffff;
        }

        /* =========================
           BOTONES PRINCIPALES
        ========================= */

        .main-buttons {
            display: flex;
            justify-content: center;
            align-items: stretch;

            width: min(760px, 100%);
            min-height: 90px;

            margin: auto;
        }

        .main-button {
            position: relative;

            flex: 1;

            min-width: 0;

            padding: 22px 15px;

            font-family: "Press Start 2P", monospace;
            font-size: clamp(9px, 1.5vw, 13px);

            cursor: pointer;

            border: 4px solid;
            color: white;

            transition:
                flex 0.5s cubic-bezier(.68,-0.55,.27,1.55),
                transform 0.5s cubic-bezier(.68,-0.55,.27,1.55),
                filter 0.3s ease;
        }

        .main-button:hover {
            transform: translateY(-5px);
        }

        .rankings-button {
            background: #1756a5;
            border-color: #4389dc;

            box-shadow: 6px 6px 0 #082c59;
        }

        .upload-button {
            background: #d92828;
            border-color: #ff6262;

            box-shadow: 6px 6px 0 #720d0d;
        }

        /* Estado seleccionado */

        .main-buttons.rankings-active .rankings-button {
            flex: 2.2;
            transform: scale(1.03);
        }

        .main-buttons.rankings-active .upload-button {
            flex: 0.8;
            transform: scale(0.88);
            filter: brightness(0.65);
        }

        .main-buttons.upload-active .upload-button {
            flex: 2.2;
            transform: scale(1.03);
        }

        .main-buttons.upload-active .rankings-button {
            flex: 0.8;
            transform: scale(0.88);
            filter: brightness(0.65);
        }

        /* =========================
           PANEL DINÁMICO
        ========================= */

        .dynamic-area {
            width: min(1000px, 100%);
            margin-top: 45px;

            overflow: hidden;
        }

        .panel {
            display: none;

            padding: 35px;

            background: rgba(8, 13, 27, 0.92);

            border: 3px solid #174b91;

            box-shadow:
                8px 8px 0 rgba(0, 0, 0, 0.5);

            animation: panelEnter 0.6s cubic-bezier(.22,1,.36,1);
        }

        .panel.visible {
            display: block;
        }

        @keyframes panelEnter {
            from {
                opacity: 0;
                transform: translateY(80px) translateX(-35px);
            }

            to {
                opacity: 1;
                transform: translateY(0) translateX(0);
            }
        }

        .panel h3 {
            margin-top: 0;

            color: #f7d046;
            font-size: 18px;
            line-height: 1.7;
        }

        /* =========================
           RANKING DE PRUEBA
        ========================= */

        .ranking-row {
            display: grid;
            grid-template-columns: 80px 1fr 180px 150px;

            align-items: center;

            padding: 18px;

            margin-top: 10px;

            background: #111a2f;
            border: 2px solid #243b63;

            font-size: 10px;
        }

        .ranking-row.first {
            background: linear-gradient(90deg, #4d3b08, #171a24);
            border-color: #f7d046;

            box-shadow: 0 0 18px rgba(247, 208, 70, 0.18);
        }

        .place {
            color: #f7d046;
        }

        .time {
            color: #4c9dff;
        }

        .info-button {
            padding: 10px;

            border: 2px solid #4389dc;
            background: #1756a5;
            color: white;

            font-family: "Press Start 2P", monospace;
            font-size: 8px;

            cursor: pointer;
        }

        .info-button:hover {
            background: #236fc8;
        }

        /* =========================
           SUBIR RUN
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 9px;
            color: #f7d046;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;

            padding: 14px;

            background: #070b15;
            border: 2px solid #31517e;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 15px;

            outline: none;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #4389dc;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .warning {
            margin-top: 25px;
            padding: 15px;

            border: 2px solid #d92828;

            color: #ff7777;

            font-size: 8px;
            line-height: 2;
        }

        .submit-button {
            margin-top: 25px;

            padding: 18px 25px;

            background: #d92828;
            border: 3px solid #ff6262;
            box-shadow: 5px 5px 0 #720d0d;

            color: white;

            font-family: "Press Start 2P", monospace;
            font-size: 10px;

            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-3px);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 750px) {

            header {
                height: auto;
                min-height: 75px;

                padding: 15px;

                flex-wrap: wrap;
                gap: 15px;
            }

            .logo {
                font-size: 13px;
            }

            .trophy {
                font-size: 24px;
            }

            nav {
                width: 100%;
                justify-content: center;
                gap: 12px;
            }

            nav button,
            .extras-button {
                font-size: 8px;
            }

            .extras-button {
                padding: 10px;
            }

            main {
                padding-top: 60px;
            }

            .main-buttons {
                min-height: 75px;
            }

            .main-button {
                padding: 15px 8px;
                font-size: 8px;
            }

            .panel {
                padding: 20px;
            }

            .ranking-row {
                grid-template-columns: 45px 1fr 100px;

                font-size: 8px;
            }

            .ranking-row .date {
                display: none;
            }

            .info-button {
                font-size: 6px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- Fondo -->
    <div class="background">
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
        <div class="pixel"></div>
    </div>

    <!-- HEADER -->
    <header>

        <a class="logo" href="#">
            <span class="trophy">🏆</span>
            <span>SPEEDRUNS</span>
        </a>

        <nav>
    <button>INICIO</button>
    <button>JUEGOS</button>
    <button>RANKINGS</button>
<button class="account-button" onclick="openAccount()">
    👤 CUENTA
</button>
    

    <button class="extras-button">
        ☰ EXTRAS
    </button>
</nav>

    </header>


    <!-- CONTENIDO -->
    <main>

        <section class="hero">

            <h1>🏆 SPEEDRUNS</h1>

            <h2>DEMOSTRÁ LO QUE PODÉS HACER</h2>


            <!-- BOTONES -->
            <div class="main-buttons" id="mainButtons">

                <button
                    class="main-button rankings-button"
                    id="rankingsButton"
                    onclick="showPanel('rankings')">

                    VER RANKINGS

                </button>

                <button
                    class="main-button upload-button"
                    id="uploadButton"
                    onclick="showPanel('upload')">

                    SUBIR RUN

                </button>

            </div>


            <!-- CONTENIDO QUE APARECE ABAJO -->
            <div class="dynamic-area">

                <!-- RANKINGS -->
                <section
                    class="panel"
                    id="rankingsPanel">

                    <h3>🏆 SUPER MARIO BROS. — ANY%</h3>

                    <div class="ranking-row first">

                        <span class="place">🥇 #1</span>

                        <span>PAPU</span>

                        <span class="time">18.540</span>

                        <span class="date">17/08/2026</span>

                    </div>

                    <div class="ranking-row">

                        <span class="place">🥈 #2</span>

                        <span>DIEGO</span>

                        <span class="time">18.720</span>

                        <button class="info-button">
                            MÁS INFO
                        </button>

                    </div>

                    <div class="ranking-row">

                        <span class="place">🥉 #3</span>

                        <span>LEO</span>

                        <span class="time">19.010</span>

                        <button class="info-button">
                            MÁS INFO
                        </button>

                    </div>

                </section>


                <!-- SUBIR RUN -->
                <section
                    class="panel"
                    id="uploadPanel">

                    <h3>🎮 SUBIR RUN</h3>

                    <div class="form-grid">

                        <div class="field">
                            <label>CATEGORÍA</label>

                            <select>
                                <option>Any%</option>
                                <option>Warpless</option>
                                <option>1-1</option>
                                <option>1-2</option>
                                <option>1-3</option>
                                <option>1-4</option>
                            </select>
                        </div>


                        <div class="field">
                            <label>TIEMPO</label>

                            <input
                                type="text"
                                placeholder="00:00:00.000">
                        </div>


                        <div class="field">
                            <label>FECHA</label>

                            <input
                                type="date">
                        </div>


                        <div class="field">
                            <label>VIDEO (OPCIONAL)</label>

                            <input
                                type="url"
                                placeholder="https://...">
                        </div>


                        <div class="field">
                            <label>PLATAFORMA / EMULADOR</label>

                            <input
                                type="text"
                                placeholder="Ej: NES / Mesen">
                        </div>


                        <div class="field">
                            <label>MÉTODO DE CONTROL</label>

                            <input
                                type="text"
                                placeholder="Ej: Control">
                        </div>


                        <div class="field full">
                            <label>DESCRIPCIÓN</label>

                            <textarea
                                placeholder="Contá algo sobre esta run..."></textarea>
                        </div>

                    </div>


                    <div class="warning">
                        ⚠ IMPORTANTE: UNA VEZ ENVIADA Y PUBLICADA,
                        ESTA RUN NO PODRÁ SER EDITADA NI ELIMINADA.
                    </div>


                    <button class="submit-button">
                        ENVIAR PARA APROBACIÓN
                    </button>

                </section>

            </div>

        </section>

    </main>


    <script>

        const mainButtons = document.getElementById("mainButtons");

        const rankingsPanel = document.getElementById("rankingsPanel");

        const uploadPanel = document.getElementById("uploadPanel");


       function openAccount() {
    alert("Sistema de cuentas próximamente");
}

            mainButtons.classList.remove(
                "rankings-active",
                "upload-active"
            );


            rankingsPanel.classList.remove("visible");
            uploadPanel.classList.remove("visible");


            if (panel === "rankings") {

                mainButtons.classList.add("rankings-active");

                rankingsPanel.classList.add("visible");

            }


            if (panel === "upload") {

                mainButtons.classList.add("upload-active");

                uploadPanel.classList.add("visible");

            }

        }

    </script>
<script src="supabase.js"></script>
    
</body>
</html>
