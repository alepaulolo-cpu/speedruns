<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedRuns</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: #00ff88;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .game {
            background: #1c1c1c;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
        }

        .game:hover {
            border-color: #00ff88;
        }

        .game h3 {
            margin-top: 0;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🏆 SPEEDRUNS</h1>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Juegos</a>
        <a href="#">Rankings</a>
        <a href="#">Speedrunners</a>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>Superá tus límites.</h2>
        <p>Una nueva plataforma para registrar y competir en speedruns.</p>
    </section>

    <h2>Juegos</h2>

    <section class="games">

        <div class="game">
            <h3>🍄 Super Mario Bros.</h3>
            <p>Any%</p>
        </div>

        <div class="game">
            <h3>🎮 Próximamente</h3>
            <p>Más juegos</p>
        </div>

        <div class="game">
            <h3>⚡ Próximamente</h3>
            <p>Más categorías</p>
        </div>

    </section>

</main>

<footer>
    SpeedRuns © 2026
</footer>

</body>
</html>
